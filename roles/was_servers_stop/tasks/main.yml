- name: Stop WebSphere Application Server
  ansible.builtin.command: "{{ profiles_dir }}/{{ item }}/bin/stopServer.sh server1"
  loop: "{{ profile_names[target_vm] }}"
  loop_control:
    loop_var: item
  register: serverstatus_output
  failed_when: "'Server server1 is already stopped' not in serverstatus_output.stdout and serverstatus_output.rc != 0"
  changed_when: "'Server server1 stopped' in serverstatus_output.stdout"

- name: Show updated Server Status
  ansible.builtin.debug:
    msg: "Server start output: {{ serverstatus_output.stdout }}"
