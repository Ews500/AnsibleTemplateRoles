---

- name: Debug output app_group
  ansible.builtin.debug:
    msg: "{{ app_group }}"

- name: Run block if app is not "ND"
  when: app_group != "nd" and app_group != "ihs"
  block:
    - name: Include environment and app level variables
      ansible.builtin.include_vars:
        file: "../../../environments/{{ env_code }}/group_vars/{{ app_group }}.yml"

    - name: Template stop_services
      become: true
      become_user: root
      ansible.builtin.template:
        src: stop_template.sh.j2
        dest: /sysman/operators/stop_websphere_{{ server_name | lower }}
        owner: root
        group: root
        mode: "0755"

    - name: Template start_services
      become: true
      become_user: root
      ansible.builtin.template:
        src: start_template.sh.j2
        dest: /sysman/operators/start_websphere_{{ server_name | lower }}
        owner: root
        group: root
        mode: "0755"
