---
- name: Stop WebSphere Application Server service
  become: true
  become_user: root
  block:
    - name: Assert that app is standalone
      run_once: true
      ansible.builtin.assert:
        that:
          - "env_vars.dmgr_host is not defined"
        fail_msg: "app={{ app }} - Application {{ env_vars.app_name }} is not standalone"
        success_msg: "app={{ app }} - Application {{ env_vars.app_name }} is standalone"

    - name: Output application and host level variables
      ansible.builtin.debug:
        msg: "app_name - {{ env_vars.app_name }}, profile_name - {{ env_vars.profile_name }}, server_name - {{ env_vars.server_name }}, was_path - {{ was_path }}" # noqa yaml[line-length]

    - name: Set service_name
      ansible.builtin.set_fact:
        service_name: "was_{{ env_code | lower }}{{ app_vars.common_app_group | default(app | lower) }}.service"

    - name: Check service status
      ansible.builtin.service_facts:

    - name: Output service status
      ansible.builtin.debug:
        var: ansible_facts.services[service_name]

    - name: Check if processes are running
      ansible.builtin.shell: "set -o pipefail && ps -fu webadmn | grep java | grep -v grep | egrep -E -- '{{ env_vars.profile_name }}' | awk {'print $2'}"  # noqa yaml[line-length] no-changed-when
      register: running_processes
      failed_when: false
      changed_when: running_processes.stdout_lines | length > 0

    - name: Print process ID
      ansible.builtin.debug:
        var: running_processes.stdout_lines
      when: running_processes.stdout_lines | length > 0

    - name: Stop profile if service is not running and process is running  # noqa no-changed-when
      become: true
      become_user: webadmn
      ansible.builtin.command:
        cmd: "{{ was_path }}/profiles/{{ env_vars.profile_name }}/bin/stopServer.sh {{ env_vars.server_name | default('server1') }}"
      when:
        - ansible_facts.services[service_name].state != "running"
        - running_processes.stdout_lines | length > 0

    - name: Stop service if service is running
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: stopped
      when: ansible_facts.services[service_name].state == "running"
      async: 300 # wait for up to 300 sec, poll every 10 sec
      poll: 10

  rescue:
    - name: Kill PID
      ansible.builtin.command: "kill -9 {{ kill_pid }}"
      with_items: "{{ running_processes.stdout_lines }}"
      loop_control:
        loop_var: kill_pid
      changed_when: false
      failed_when: false
