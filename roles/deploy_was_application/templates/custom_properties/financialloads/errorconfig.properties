#Ebaz Error Handling
#Requirement is that the application should stop because of certain SQL exception
#Requirement is that the application should return meaningful error messages to CONTROL M when it stops
#We need to differentiate between Genesis,symphony and reports database.
#G- Genesis ,S -Symphony ,R-reports database
# Example G_-06502 =Server error
S_1400 = An internal server exception happened. More info in the application logs
S_03113 = end-of-file on communication channel
S_3113 = end-of-file on communication channel
R_0 = Reports Database not available
S_6550 = Insufficient Privileges
S_00942 = table or view does not exist
S_942 = table or view does not exist
