---

# ####################### DEPLOYMENT MANAGER SERVICE #######################

- name: Deployment manager service
  when: app == "dmgr"
  block:
    - name: Create service - dmgr
      become: true
      become_user: root
      ansible.builtin.template:
        src: was_dmgr.service.j2
        dest: "/etc/systemd/system/was_dmgr.service"
        mode: "0600"

    - name: Display service unit file - dmgr
      ansible.builtin.slurp:
        src: "/etc/systemd/system/was_dmgr.service"
      register: file_output

    - name: Print service unit file - dmgr
      ansible.builtin.debug:
        msg: "{{ file_output.content | b64decode }}"

    - name: Enable service - dmgr
      become: true
      become_user: root
      ansible.builtin.systemd:
        name: was_dmgr.service
        enabled: true
        daemon_reload: true

    - name: Allow webadmn to SUDO (/etc/sudoers.d/03-webteam) - dmgr
      become: true
      become_user: root
      ansible.builtin.blockinfile:
        path: /etc/sudoers.d/03-webteam
        marker: "## {mark} was_dmgr.service ANSIBLE MANAGED BLOCK"
        block: |
          webadmn ALL=NOPASSWD: /bin/systemctl restart was_dmgr.service
          webadmn ALL=NOPASSWD: /bin/systemctl stop was_dmgr.service
          webadmn ALL=NOPASSWD: /bin/systemctl start was_dmgr.service
          webadmn ALL=NOPASSWD: /bin/systemctl status was_dmgr.service

    - name: Allow Ops team to SUDO (/etc/sudoers.d/04-opsteam) - dmgr
      become: true
      become_user: root
      ansible.builtin.blockinfile:
        path: /etc/sudoers.d/04-opsteam
        marker: "## {mark} was_dmgr.service ANSIBLE MANAGED BLOCK"
        block: |
          OPS_TEAM ALL=NOPASSWD: /bin/systemctl restart was_dmgr.service
          OPS_TEAM ALL=NOPASSWD: /bin/systemctl stop was_dmgr.service
          OPS_TEAM ALL=NOPASSWD: /bin/systemctl start was_dmgr.service
          OPS_TEAM ALL=NOPASSWD: /bin/systemctl status was_dmgr.service

