# ####################### STOP WAS APPSERVERS SERVICE #######################

- name: Stop WAS app servers service
  when: app == "nd"
  block:
    - name: Create service - stop_was_appservers
      become: true
      become_user: root
      ansible.builtin.template:
        src: stop_was_appservers.service.j2
        dest: "/etc/systemd/system/stop_was_appservers.service"
        mode: "0600"

    - name: Display service unit file - stop_was_appservers
      ansible.builtin.slurp:
        src: "/etc/systemd/system/stop_was_appservers.service"
      register: file_output

    - name: Print service unit file - stop_was_appservers
      ansible.builtin.debug:
        msg: "{{ file_output.content | b64decode }}"

    - name: Enable service - stop_was_appservers
      become: true
      become_user: root
      ansible.builtin.systemd:
        name: stop_was_appservers.service
        enabled: true
        daemon_reload: true
        state: started

# ####################### APPLICATION SERVER SERVICE (only standalone) #######################

- name: Application server service
  when: app != "dmgr" and app != "nd" and app != "ihs"
  block:
    - name: Fail for managed app servers (systemd not supported / recommended)
      ansible.builtin.fail:
        msg: "ERROR - systemd service WON'T BE CREATED for managed application servers (ND) - {{ app }} "
      when: dmgr_host is defined

    - name: Create service - standalone app server
      become: true
      become_user: root
      ansible.builtin.template:
        src: was_appserver.service.j2
        dest: "/etc/systemd/system/was_{{ env_code | lower }}{{ app }}.service"
        mode: "0600"

    - name: Display service unit file - standalone app server
      ansible.builtin.slurp:
        src: "/etc/systemd/system/was_{{ env_code | lower }}{{ app }}.service"
      register: file_output

    - name: Print service unit file - standalone app server
      ansible.builtin.debug:
        msg: "{{ file_output.content | b64decode }}"

    - name: Enable service - standalone app server
      become: true
      become_user: root
      ansible.builtin.systemd:
        name: "was_{{ env_code | lower }}{{ app }}.service"
        enabled: "{{ enable_services | default('true') }}"
        daemon_reload: true

    - name: Allow webadmn to SUDO (/etc/sudoers.d/03-webteam) - standalone app server
      become: true
      become_user: root
      ansible.builtin.blockinfile:
        path: /etc/sudoers.d/03-webteam
        marker: "## {mark} was_{{ env_code | lower }}{{ app }}.service ANSIBLE MANAGED BLOCK"
        block: |
          webadmn ALL=NOPASSWD: /bin/systemctl restart was_{{ env_code | lower }}{{ app }}.service
          webadmn ALL=NOPASSWD: /bin/systemctl stop was_{{ env_code | lower }}{{ app }}.service
          webadmn ALL=NOPASSWD: /bin/systemctl start was_{{ env_code | lower }}{{ app }}.service
          webadmn ALL=NOPASSWD: /bin/systemctl status was_{{ env_code | lower }}{{ app }}.service

    - name: Allow Ops team to SUDO (/etc/sudoers.d/04-opsteam) - standalone app server
      become: true
      become_user: root
      ansible.builtin.blockinfile:
        path: /etc/sudoers.d/04-opsteam
        marker: "## {mark} was_{{ env_code | lower }}{{ app }}.service ANSIBLE MANAGED BLOCK"
        block: |
          OPS_TEAM ALL=NOPASSWD: /bin/systemctl restart was_{{ env_code | lower }}{{ app }}.service
          OPS_TEAM ALL=NOPASSWD: /bin/systemctl stop was_{{ env_code | lower }}{{ app }}.service
          OPS_TEAM ALL=NOPASSWD: /bin/systemctl start was_{{ env_code | lower }}{{ app }}.service
          OPS_TEAM ALL=NOPASSWD: /bin/systemctl status was_{{ env_code | lower }}{{ app }}.service

