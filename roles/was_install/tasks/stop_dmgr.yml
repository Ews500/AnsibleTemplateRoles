- name: Stop WebSphere Application Server Deployment Manager
  delegate_to: "{{ dmgr_host }}"
  run_once: true
  block:
    - name: Verify if pid file exists and process is running
      ansible.builtin.shell: "ps -p $(cat {{ target_group_vars.was_path }}/profiles/{{ target_group_vars.dmgr_profile }}/logs/dmgr/dmgr.pid) > /dev/null" # noqa yaml[line-length]
      register: deployment_manager_is_running
      ignore_errors: true
      changed_when: false

    - name: Stop Deployment Manager
      ansible.builtin.command: "sudo /bin/systemctl stop was_dmgr.service"
      register: dmgr_stop
      changed_when: dmgr_stop.rc == 0
      when: deployment_manager_is_running.rc == 0
      async: 30 # wait for up to 30 sec, poll every 10 sec
      poll: 10
