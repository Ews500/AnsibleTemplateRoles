---
# was_create_standalone_profile.yml
# Description: Create a standalone profile in WebSphere Application Server
# Author: Manbir Singh (@GBMSINGH)
# Created: 2025-01-16
# Last Modified: 2025-08-05
- name: WebSphere Application Server Profile Creation
  hosts: "{{ app | default('null') }}"
  gather_subset:
    - '!all'
    - 'min'
  become: true
  become_user: webadmn

  # Always include common pre-tasks
  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - app is defined
          - app | length > 0
          - env_code is defined
          - env_code in ['BAT', 'FATF', 'FATW', 'PROD', 'RELS']
        fail_msg: |
          Required variables missing or invalid:
          - app: {{ app | default('UNDEFINED') }}
          - env_code: {{ env_code | default('UNDEFINED') }}
          Valid env_code values: BAT, FATF, FATW, PROD, RELS
        success_msg: "Variable validation passed for app '{{ app }}' in environment '{{ env_code }}'"
      tags: always

    - name: Load vault secrets
      no_log: true # To avoid printing variables in output
      ansible.builtin.include_vars:
        file: "environments/{{ env_code }}/vault.yml"
      tags: always

    - name: Include group_vars all.yml
      ansible.builtin.include_vars:
        file: "environments/{{ env_code }}/group_vars/all.yml"
      tags: always

    - name: Include env level variables
      ansible.builtin.include_vars:
        file: "environments/{{ env_code }}/group_vars/{{ app | lower }}.yml"
        name: env_vars
      tags: always

    - name: Include app level variables
      ansible.builtin.include_vars:
        file: "environments/app_vars/{{ app | lower }}.yml"
        name: app_vars
      tags: always

    - name: Debug hostname variables
      ansible.builtin.debug:
        msg:
          - "inventory_hostname: {{ inventory_hostname }}"
          - "inventory_hostname_short: {{ inventory_hostname_short }}"
          - "ansible_hostname: {{ ansible_hostname | default('undefined') }}"
      tags: always

    - name: Include host level variables - Standalone
      ansible.builtin.include_vars:
        dir: "environments/{{ env_code }}/host_vars/"
        files_matching: "^(all|{{ inventory_hostname_short }})[.]yml$"
      tags: always

    # No need to load dmgr host_vars for standalone

  # Main task execution
  tasks:
    - name: Create Standalone Profile
      ansible.builtin.include_role:
        name: was_create_standalone_profile
      tags: always

    - name: Configure IHS Plugin for Standalone Profile
      ansible.builtin.include_role:
        name: was_ihs_plgin_config
      tags: always
