---
# was_create_linux_service.yml
# Description: Create a Linux systemd service for a WAS standalone application server, deployment manager, or IHS.
# Author: Daniel Benitez Aguila (@ESDBEN2)
# Created: 2024-06-26
# Last Modified: 2025-08-05

- name: Create Linux Service
  hosts: "{{ app | default('null') }}"
  gather_subset:
    - '!all'
    - 'min'

  # Always include common pre-tasks
  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - app is defined
          - app | length > 0
          - env_code is defined
          - env_code in ['BAT', 'FATF', 'FATW', 'PROD', 'RELS']
        fail_msg: |
          Required variables missing or invalid:
          - app: {{ app | default('UNDEFINED') }}
          - env_code: {{ env_code | default('UNDEFINED') }}
          Valid env_code values: BAT, FATF, FATW, PROD, RELS
        success_msg: "Variable validation passed for app '{{ app }}' in environment '{{ env_code }}'"
      tags: always

    - name: Load vault secrets
      no_log: true # To avoid printing variables in output
      ansible.builtin.include_vars:
        file: "environments/{{ env_code }}/vault.yml"
      tags: always

    - name: Include host level variables
      tags: always
      ansible.builtin.include_vars:
        dir: "environments/{{ env_code }}/host_vars/"
        files_matching: "^(all|{{ hostvars[inventory_hostname].inventory_hostname_short }})[.]yml$"

    - name: Load app variables # Just for app servers groups
      when: app != "dmgr" and app != "nd" and app != "ihs"
      block:
        - name: Include env level variables
          ansible.builtin.include_vars:
            file: "environments/{{ env_code }}/group_vars/{{ app | lower }}.yml"
            name: env_vars

        - name: Debug env_vars
          ansible.builtin.debug:
            msg: "app {{ app }} - profile_name {{ env_vars.profile_name }} - server_name {{ env_vars.server_name }}"

  # Main task execution
  tasks:
    - name: Deploy application
      ansible.builtin.include_role:
        name: linux_service
